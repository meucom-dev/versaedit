name: Publicação no npm (beta)

# Só manual (Actions → "Publicação no npm (beta)" → Run workflow), só na main,
# e com aprovação no ambiente "npm-publish" (Settings → Environments →
# Required reviewers). Usa Trusted Publishing (OIDC): nenhum token guardado.
# Configuração no npmjs.com (Package → Settings → Trusted publisher):
#   Organization or user: meucom-dev · Repository: versaedit
#   Workflow filename: release.yml · Environment name: npm-publish
# Com o repositório público, o npm gera a proveniência automaticamente.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar — igual à do package.json (ex.: 0.5.0-beta.2)'
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Testa e publica com a tag beta
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing: Node 22.14+ e npm 11.5.1+
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11.21.0
      - name: Conferências antes de publicar
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const p = require('./package.json')
            const fail = (m) => { console.error('✖ ' + m); process.exit(1) }
            if (p.private) fail('package.json ainda tem private: true')
            if (p.version !== process.env.VERSION) fail('versão pedida ' + process.env.VERSION + ' ≠ package.json ' + p.version)
            if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(p.version)) fail('só versões beta (x.y.z-beta.n) por este workflow')
            if (p.publishConfig?.tag !== 'beta') fail('publishConfig.tag deve ser beta')
            if (p.repository?.url !== 'git+https://github.com/meucom-dev/versaedit.git') fail('repository.url diferente do repositório')
            console.log('✔ versaedit@' + p.version + ' pronto para publicar com a tag beta')
          "
          grep -q "## \[$VERSION\]" CHANGELOG.md || { echo "✖ CHANGELOG sem a seção [$VERSION]"; exit 1; }
          if grep -q "release:pending" README.md README.pt-BR.md README.es.md; then
            echo "✖ README ainda com o aviso 'não publicado' (release:pending)"; exit 1
          fi
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:package
      - name: Validadores de distribuição
        run: |
          npm exec --yes --before=2026-10-01 -- publint@0.3.24 --strict
          npm exec --yes --before=2026-10-01 --package=@arethetypeswrong/cli@latest -- \
            attw --pack . --profile esm-only --exclude-entrypoints versaedit.css versaedit-content.css
      - name: Publica
        run: npm publish --tag beta
      - name: Confere no registro
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sleep 20
          npm view "versaedit@$VERSION" version
          npm view versaedit dist-tags
